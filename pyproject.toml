[project]
name = "tunnelsimulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tunnelsim", "tunnelsim-server"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "server"]

[tool.uv.sources]
tunnelsim = { workspace = true }
tunnelsim-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
